[project]
name = "redis-streams-cleaner"
version = "1.0.0"
description = "Cleans up Redis Streams idle consumers"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

# Use requirements/main.in for runtime dependencies instead.
dependencies = [
    "redis",
]

[project.urls]
Source = "https://github.com/lsst-dm/redis-streams-cleaner"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "uv",
]
lint = [
    "prek",
    "ruff",
]
typing = [
    "mypy",
    "types-PyYAML",
    "types-python-dateutil"
]

[tool.setuptools_scm]

[tool.mypy]
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
local_partial_types = true
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]
no_implicit_reexport = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

entry_title_template = "{{ version }} ({{ date.strftime('%Y-%m-%d') }})"
format = "md"
md_header_level = "2"
new_fragment_template = "file:changelog.d/_template.md.jinja"
skip_fragments = "_template.md.jinja"

[tool.ruff]
extend = "ruff-shared.toml"
extend-exclude = [
    "tests/data/**",
]
line-length = 79

[tool.ruff.lint]
ignore = [
    "D100",
    "D104",
    "INP001",  # ADD THIS
]

[tool.ruff.lint.isort]
known-first-party = ["redis_streams_cleaner"]
